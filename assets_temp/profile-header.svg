<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
<title id="title">Abdul Moiz Hussain — software should feel deliberate</title>
<desc id="desc">Backend engineer and open-source contributor working with Go, TypeScript and cloud-native systems.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0d1117"/>
    <stop offset="100%" stop-color="#11161d"/>
  </linearGradient>
  <radialGradient id="glow" cx="85%" cy="10%" r="65%">
    <stop offset="0%" stop-color="#e3a24b" stop-opacity=".16"/>
    <stop offset="55%" stop-color="#c9784a" stop-opacity=".05"/>
    <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
  </radialGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#30363d" stroke-width="1" opacity=".18"/>
  </pattern>
</defs>

<rect width="1200" height="320" rx="20" fill="url(#bg)"/>
<rect width="1200" height="320" rx="20" fill="url(#grid)"/>
<rect width="1200" height="320" rx="20" fill="url(#glow)"/>
<rect x=".5" y=".5" width="1199" height="319" rx="19.5" fill="none" stroke="#2a313b"/>

<text x="66" y="94" fill="#f2eee8" font-family="Georgia, 'Times New Roman', serif" font-size="49" font-style="italic" font-weight="700">
  software should feel deliberate.
</text>
<text x="68" y="139" fill="#8f979f" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="17">
  backend systems, open source, and engineering beyond the happy path.
</text>

<line x1="66" y1="178" x2="1134" y2="178" stroke="#2a313b"/>

<text x="68" y="216" fill="#e3a24b" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="700" letter-spacing="2">ENGINEER</text>
<text x="68" y="246" fill="#f2eee8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="600">Abdul Moiz Hussain</text>
<text x="68" y="273" fill="#8f979f" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="13">backend-first · full-stack · open source</text>

<text x="450" y="216" fill="#e3a24b" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="700" letter-spacing="2">CONTRIBUTING</text>
<text x="450" y="246" fill="#f2eee8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="600">Alibaba · KubeStellar</text>
<text x="450" y="273" fill="#8f979f" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="13">reliability · testing · maintainability</text>

<text x="870" y="216" fill="#e3a24b" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="700" letter-spacing="2">WORKING SET</text>
<text x="870" y="246" fill="#f2eee8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="600">Go · TypeScript · PostgreSQL</text>
<text x="870" y="273" fill="#8f979f" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="13">APIs · realtime · cloud-native systems</text>

<circle cx="1130" cy="49" r="6" fill="#7eb77f"/>
<text x="1110" y="54" fill="#8f979f" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="11">BUILDING IN PUBLIC</text>
</svg>