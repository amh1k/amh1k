<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Abdul Moiz Hussain profile header</title>
  <desc id="desc">Software should feel deliberate. Backend engineer and open-source contributor.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#111821"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#30363d" stroke-width="1" opacity="0.22"/>
    </pattern>
    <filter id="soft">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#grid)"/>

  <circle cx="1030" cy="55" r="115" fill="#1f6feb" opacity="0.12" filter="url(#soft)"/>
  <circle cx="1120" cy="255" r="135" fill="#2ea043" opacity="0.09" filter="url(#soft)"/>

  <text x="64" y="95"
        fill="#f0f6fc"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="48"
        font-style="italic"
        font-weight="700">
    software should feel deliberate.
  </text>

  <text x="66" y="140"
        fill="#8b949e"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="18">
    backend systems, open source, and engineering beyond the happy path.
  </text>

  <line x1="64" y1="174" x2="1136" y2="174" stroke="#30363d"/>

  <text x="66" y="210" fill="#6e7681"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="12" font-weight="700" letter-spacing="2">ENGINEER</text>
  <text x="66" y="238" fill="#c9d1d9"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="16">Abdul Moiz Hussain</text>

  <text x="415" y="210" fill="#6e7681"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="12" font-weight="700" letter-spacing="2">CONTRIBUTING</text>
  <text x="415" y="238" fill="#c9d1d9"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="16">Alibaba · KubeStellar · cloud-native OSS</text>

  <text x="890" y="210" fill="#6e7681"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="12" font-weight="700" letter-spacing="2">WORKING SET</text>
  <text x="890" y="238" fill="#c9d1d9"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="16">Go · TypeScript · PostgreSQL</text>

  <circle cx="1128" cy="48" r="7" fill="#2ea043"/>
  <text x="1110" y="78" fill="#6e7681"
        text-anchor="end"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="11">BUILDING IN PUBLIC</text>
</svg>
