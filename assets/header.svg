<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 138" role="img" aria-labelledby="title desc">
  <title id="title">Abdul Moiz Hussain — backend-first engineer</title>
  <desc id="desc">A minimal animated terminal header with a cyan-to-violet activity waveform.</desc>

  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="52%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="18%" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="82%" stop-color="#8b5cf6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-80%" width="160%" height="260%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .primary { fill: #7d8590; }
    .muted { fill: #6e7681; }
    .title { font: 700 31px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; letter-spacing: .4px; }
    .tagline { font: 400 16px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .meta { font: 400 13px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .cursor { animation: blink 1.05s steps(1, end) infinite; }
    .wave { stroke-dasharray: 10 8; animation: flow 8s linear infinite; }
    .dot1 { animation: pulse 2.6s ease-in-out infinite; }
    .dot2 { animation: pulse 2.6s ease-in-out .65s infinite; }
    .dot3 { animation: pulse 2.6s ease-in-out 1.3s infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes flow { to { stroke-dashoffset: -360; } }
    @keyframes pulse { 0%, 100% { opacity: .25; r: 2.5px; } 50% { opacity: 1; r: 4px; } }
    @media (prefers-reduced-motion: reduce) {
      .cursor, .wave, .dot1, .dot2, .dot3 { animation: none; }
    }
  </style>

  <g transform="translate(30 23)">
    <text x="0" y="28" fill="#22d3ee" class="title">&gt;_</text>
    <text x="65" y="28" class="title" fill="url(#accent)">ABDUL MOIZ HUSSAIN</text>
    <rect class="cursor" x="430" y="3" width="4" height="31" rx="2" fill="#22d3ee"/>

    <text x="66" y="60" class="tagline primary">Backend-first full-stack engineer building APIs, infrastructure, and real-time systems.</text>
    <text x="66" y="85" class="meta muted">Go · TypeScript · distributed systems · open source</text>
  </g>

  <g transform="translate(610 5)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 43 H360" stroke="url(#fade)" stroke-width="1"/>
    <path class="wave" filter="url(#softGlow)" d="M0 43 C22 43 29 37 47 37 C69 37 76 50 95 50 C118 50 126 15 148 15 C171 15 178 63 205 63 C232 63 238 25 262 25 C286 25 294 50 318 50 C336 50 345 41 360 41" stroke="url(#accent)" stroke-width="2.2"/>
    <circle class="dot1" cx="95" cy="50" r="2.5" fill="#22d3ee" stroke="none"/>
    <circle class="dot2" cx="205" cy="63" r="2.5" fill="#38bdf8" stroke="none"/>
    <circle class="dot3" cx="318" cy="50" r="2.5" fill="#8b5cf6" stroke="none"/>
  </g>

  <path d="M30 126 H970" stroke="url(#fade)" stroke-width="1"/>
</svg>
