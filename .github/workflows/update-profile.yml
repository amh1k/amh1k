name: Update profile dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */12 * * *"
  push:
    paths:
      - "profile.config.json"
      - "scripts/generate_profile.py"
      - ".github/workflows/update-profile.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Refresh live assets and marked README metrics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_profile.py
      - name: Commit updated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets README.md
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh profile dashboard"
          git push
