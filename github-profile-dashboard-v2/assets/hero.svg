<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 250" role="img" aria-label="Abdul Moiz Hussain profile header">
<defs>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset=".55" stop-color="#60a5fa"/><stop offset="1" stop-color="#a855f7"/></linearGradient>
  <linearGradient id="faint" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee" stop-opacity="0"/><stop offset=".2" stop-color="#22d3ee" stop-opacity=".55"/><stop offset=".8" stop-color="#a855f7" stop-opacity=".55"/><stop offset="1" stop-color="#a855f7" stop-opacity="0"/></linearGradient>
  <filter id="glow" x="-30%" y="-100%" width="160%" height="300%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}
  .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
</style>

<style>
  .cursor{animation:blink 1s steps(1,end) infinite} .wave{stroke-dasharray:12 10;animation:flow 10s linear infinite}
  .d1{animation:pulse 2.5s ease-in-out infinite} .d2{animation:pulse 2.5s ease-in-out .8s infinite} .d3{animation:pulse 2.5s ease-in-out 1.6s infinite}
  @keyframes blink{50%{opacity:0}} @keyframes flow{to{stroke-dashoffset:-360}} @keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
  @media(prefers-reduced-motion:reduce){.cursor,.wave,.d1,.d2,.d3{animation:none}}
</style>
<rect width="1400" height="250" rx="18" fill="#0d1117"/>
<rect x="1" y="1" width="1398" height="248" rx="17" fill="none" stroke="#1c2530"/>
<text x="38" y="70" class="mono" font-size="52" font-weight="700" fill="#e6edf3">Hi, I’m </text>
<text x="270" y="70" class="mono" font-size="52" font-weight="700" fill="url(#accent)">Abdul Moiz Hussain</text>
<text x="768" y="70" class="mono" font-size="38" fill="#22d3ee">*</text>
<rect x="812" y="26" width="7" height="54" rx="3" fill="#e6edf3" class="cursor"/>
<text x="40" y="126" class="mono" font-size="22" fill="#b8c0cc">Backend-focused full-stack engineer building distributed systems,</text>
<text x="40" y="166" class="mono" font-size="22" fill="#b8c0cc">APIs and developer tools. Always shipping, </text>
<text x="604" y="166" class="mono" font-size="22" fill="url(#accent)">always learning.</text>
<g transform="translate(790,26)" fill="none" stroke-linecap="round">
  <path d="M0 87 H560" stroke="url(#faint)"/>
  <path class="wave" filter="url(#glow)" d="M0 87 C35 87 42 72 72 72 C104 72 111 104 142 104 C176 104 184 48 220 48 C255 48 262 128 300 128 C338 128 346 42 386 42 C425 42 432 118 470 118 C506 118 522 73 560 73" stroke="url(#accent)" stroke-width="3"/>
  <circle class="d1" cx="142" cy="104" r="4" fill="#22d3ee" stroke="none"/><circle class="d2" cx="300" cy="128" r="4" fill="#60a5fa" stroke="none"/><circle class="d3" cx="470" cy="118" r="4" fill="#a855f7" stroke="none"/>
</g>
<path d="M38 220 H1362" stroke="#26303a"/>
</svg>