<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 170" role="img" aria-labelledby="title desc">
  <title id="title">Code Review Learn Repeat</title>
  <desc id="desc">Dark terminal style callout card.</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <style>
      .title { font: 700 22px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .body { font: 400 18px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .muted { fill: #8b949e; }
      .white { fill: #e6edf3; }
      .accent { fill: url(#accent); }
      .blink { animation: blink 1s steps(1, end) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .blink { animation: none; } }
    </style>
  </defs>
  <rect width="760" height="170" rx="18" fill="#0d1117"/>
  <rect x="1" y="1" width="758" height="168" rx="17" fill="none" stroke="#21262d"/>
  <rect x="24" y="24" width="4" height="122" rx="2" fill="#22d3ee"/>
  <text x="56" y="64" class="title white">&gt; Code. Review. Learn. </text>
  <text x="408" y="64" class="title accent">Repeat.</text>
  <text x="56" y="112" class="body muted">Building software that makes a difference.</text>
  <g transform="translate(620,36)" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round">
    <path d="M30 54 l12 -20 l12 20"/>
    <path d="M84 54 l12 -20 l12 20"/>
    <path d="M23 66 h14"/>
    <path d="M77 66 h14"/>
    <path d="M43 84 c10 10 26 10 36 0"/>
    <circle cx="46" cy="62" r="3" fill="#22d3ee" stroke="none"/>
    <circle cx="86" cy="62" r="3" fill="#22d3ee" stroke="none"/>
  </g>
</svg>
